[project]
name = "microblog"
version = "0.1.0"
description = "Flask microblog tutorial app"
requires-python = "==3.15.*"
dependencies = [
    "email-validator>=2.3.0",
    "flask==3.1.3",
    "flask-login>=0.6.3",
    "flask-wtf==1.3.0",
    "ipython>=9.17.1",
    "loguru>=0.7.3",
    "peewee>=4.5.3",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "ipdb>=0.13.13",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv==1.2.4",
    "webtest>=3.0.7",
]
