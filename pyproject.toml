[project]
name = "microblog"
version = "0.1.0"
description = "Flask microblog tutorial app"
requires-python = "==3.15.*"
dependencies = [
    "flask==3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf==1.3.0",
    "ipython>=9.17.1",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "python-dotenv==1.2.4",
]
