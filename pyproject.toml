[project]
name = "microblog"
version = "0.1.0"
description = "Flask microblog tutorial app"
requires-python = "==3.15.*"
dependencies = [
    "email-validator>=2.3.0",
    "falcon>=4.4.0",
    "ipython>=9.17.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "peewee>=4.5.3",
    "werkzeug>=3.1.9",
    "wtforms>=3.3.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv==1.2.4",
    "webtest>=3.0.7",
]
