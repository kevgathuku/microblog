[project]
name = "microblog"
version = "0.1.0"
description = "Flask microblog tutorial app"
requires-python = "==3.15.*"
dependencies = [
    "email-validator>=2.3.0",
    "flask==3.1.3",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-wtf==1.3.0",
    "ipython>=9.17.1",
    "loguru>=0.7.3",
    "peewee>=4.5.3",
    "pyjwt>=2.15.1",
]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
# E4/E7/E9/F: ruff defaults. I: isort-equivalent (no separate isort needed).
# UP: pyupgrade. SIM: flake8-simplify. RUF100: stale noqa cleanup.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# pwmigrate generates these (star imports, lambdas); don't lint them.
"migrations/*.py" = ["F403", "F405", "E731"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv==1.2.4",
    "webtest>=3.0.7",
    "aiosmtpd>=1.4.6",
]
