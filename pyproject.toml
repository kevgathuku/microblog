[project]
name = "microblog"
version = "0.1.0"
description = "Flask microblog tutorial app"
requires-python = "==3.15.*"
dependencies = [
    "alembic>=1.20.1",
    "bottle>=0.13.4",
    "email-validator>=2.3.0",
    "ipython>=9.17.1",
    "jinja2>=3.1.6",
    "result>=0.17.0",
    "sqlalchemy>=2.1.6",
    "waitress>=3.0.2",
    "werkzeug>=3.1.9",
    "wtforms>=3.2.2",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "ipdb>=0.13.13",
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "webtest>=3.0.7",
]

[tool.isort]
profile = "black"
