name: CI

on:
  push:
    branches: [master, bottle-port]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run flask --app microblog db upgrade
      - run: uv run pytest -n auto -q
